<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>render-frames</title>
<style>
  @font-face{font-family:'Inter';src:url('fonts/inter.woff2') format('woff2');font-weight:100 900;font-style:normal}
  /* Sem animation, sem transition: o tempo vem so do numero do quadro. */
  *{animation:none!important;transition:none!important}
  html,body{margin:0;padding:0;background:#12081A;overflow:hidden}
  canvas{display:block;width:1920px;height:1080px}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Harness. A cena e uma FUNCAO PURA de frame: draw(ctx, frame, t, H).
 * t = frame / FPS. Nada aqui le relogio. O sorteio nativo fica bloqueado de proposito. */
(function () {
  'use strict';
  var SPEC = { FPS: 60, W: 1920, H: 1080, FRAMES: 960 };
  Math.random = function () { throw new Error('Math.random proibido: use H.mulberry32(seed)'); };

  var H = {
    SPEC: SPEC,
    clamp: function (x, a, b) { return Math.min(b, Math.max(a, x)); },
    lerp: function (a, b, k) { return a + (b - a) * k; },
    // progresso 0..1 de t entre t0 e t1
    prog: function (t, t0, t1) { return H.clamp((t - t0) / (t1 - t0), 0, 1); },
    easeOutCubic: function (k) { return 1 - Math.pow(1 - k, 3); },
    easeInOutCubic: function (k) { return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; },
    easeOutBack: function (k) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
    easeInCubic: function (k) { return k * k * k; },
    // PRNG semeado (mulberry32). Mesma seed, mesma sequencia, sempre.
    mulberry32: function (a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
  };

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { willReadFrequently: true })  /* raster em CPU: sem variacao de GPU */;
  var scene = null;

  function loadScene(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = res; s.onerror = function () { rej(new Error('scene nao carregou: ' + src)); };
      document.head.appendChild(s);
    });
  }

  var q = new URLSearchParams(location.search);
  var ready = loadScene(q.get('scene') || 'scene.js')
    .then(function () {
      scene = window.SCENE;
      if (!scene || typeof scene.draw !== 'function') throw new Error('scene.js precisa definir window.SCENE = { setup?, draw(ctx, frame, t, H) }');
      // fonte local (nunca rede): carrega os pesos antes do primeiro quadro
      return Promise.all(['300', '500', '800'].map(function (w) { return document.fonts.load(w + ' 100px Inter', 'AÁÃÇÉÓ0123456789'); }))
        .then(function () { return document.fonts.ready; });
    })
    .then(function () { if (scene.setup) scene.setup(ctx, H); window.__ready = true; });

  window.__whenReady = function () { return ready; };

  // Pura em relacao ao quadro: limpa tudo e redesenha do zero.
  window.renderFrame = function (n) {
    n = Math.round(n);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, SPEC.W, SPEC.H);
    scene.draw(ctx, n, n / SPEC.FPS, H);
    return n;
  };
})();
</script>
</body>
</html>
